<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>تقييم مودز</title>
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{
    --bg:#f7f5f2; --card:#ffffff; --fg:#1d1b19; --muted:#6f6a64; --line:#e7e2dc;
    --fire:#f89738; --fire-dark:#d97a1c; --off:#d9d4ce; --bad:#c8462c;
  }
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:'Cairo',Tahoma,Arial,sans-serif}
  .wrap{max-width:480px;margin:0 auto;padding:16px 16px 40px}
  header{text-align:center;padding:8px 0 16px}
  header img{width:130px;height:auto;display:block;margin:0 auto 8px}
  header p{margin:0;color:var(--muted);font-size:15px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:16px;padding:16px;margin-bottom:12px}
  .q{display:flex;justify-content:space-between;align-items:center;gap:8px;padding:10px 0;border-bottom:1px solid var(--line)}
  .q:last-child{border-bottom:0}
  .q span{font-weight:600;font-size:16px}
  .stars{direction:ltr;display:flex;flex-shrink:0}
  .stars button{background:none;border:0;font-size:32px;color:var(--off);cursor:pointer;padding:0 2px;line-height:1;
    -webkit-tap-highlight-color:transparent}
  .stars button.on{color:var(--fire)}
  h3{margin:0 0 10px;font-size:17px}
  .yn{display:flex;gap:10px}
  .yn button,.chip{border:1.5px solid var(--line);background:var(--card);color:var(--fg);border-radius:12px;
    padding:10px;font:inherit;font-size:15px;cursor:pointer}
  .yn button{flex:1}
  .yn button.on,.chip.on{background:var(--fire);border-color:var(--fire);color:#fff;font-weight:700}
  .group{margin-bottom:14px}
  .group b{display:block;margin-bottom:6px;color:var(--muted);font-size:14px}
  .chips{display:flex;flex-wrap:wrap;gap:8px}
  .chip{padding:8px 12px;font-size:14px}
  textarea{width:100%;min-height:90px;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);
    color:var(--fg);padding:10px;font:inherit;font-size:16px;resize:vertical}
  textarea:focus,input:focus{outline:none;border-color:var(--fire)}
  input[type=tel]{width:100%;border-radius:12px;border:1.5px solid var(--line);background:var(--bg);color:var(--fg);
    padding:12px;font:18px monospace;direction:ltr;text-align:left}
  .send{width:100%;padding:15px;border:0;border-radius:14px;background:var(--fire);color:#fff;
    font:800 19px 'Cairo',Tahoma,sans-serif;cursor:pointer}
  .send:active{background:var(--fire-dark)}
  .send:disabled{opacity:.6}
  .err{color:var(--bad);text-align:center;min-height:24px;font-size:15px;margin-bottom:6px}
  .hide{display:none}
  .done{text-align:center;padding:30px 10px}
  .done h2{margin:10px 0 6px}
  .done p{color:var(--muted);font-size:16px;line-height:1.8}
</style>
</head>

    <h2>شكراً لوقتك!</h2>
    <p id="doneMsg"></p>
  </div>
</div>

<script>
// لينك جوجل اللي بيسجل في الشيت ويبعت الإيميل
const API = 'https://script.google.com/macros/s/AKfycbzRtXsQVJX6kts7DkKEuknIgCEtYYH2QxJKUCYfQSuuv_B24ecZTSCaGNEqmVMlnvzq/exec';
const BAD_AVG = 4;

const QUESTIONS = [
  { id: 'food',      label: 'الأكل' },
  { id: 'speed',     label: 'سرعة التوصيل' },
  { id: 'call',      label: 'خدمة الكول سنتر' },
  { id: 'driver',    label: 'تعامل الطيار' },
  { id: 'packaging', label: 'التغليف' }
];

const NEGATIVES = {
  food: ['الأكل وصل بارد', 'الطعم مش زي كل مرة', 'الكمية قليلة', 'فيه صنف ناقص',
         'جالي صنف غلط', 'الأكل مش مستوي كويس', 'زيت كتير', 'الملح زيادة أو ناقص',
         'السعر غالي على الكمية'],
  speed: ['التوصيل اتأخر', 'الوقت اللي اتقالي مكانش مظبوط', 'الطيار تاه في العنوان'],
  call: ['الرد اتأخر', 'الموظف مكانش فاهم الطلب', 'أسلوب الرد مش كويس',
         'محدش أكد الأوردر', 'الأسعار اتقالت غلط'],
  driver: ['أسلوبه مش كويس', 'مكانش معاه فكة', 'طلب فلوس زيادة', 'مظهره مش مرتب'],
  packaging: ['العلبة مفتوحة أو الأكل مدلوق', 'الصوصات ناقصة أو مدلوقة',
              'الشنطة مش نضيفة', 'مفيش معالق أو مناديل']
};

const PHONE = new URLSearchParams(location.search).get('p') || '';
const stars = {}; let firstTime = ''; const negSel = new Set();
const $ = id => document.getElementById(id);
if (/^201\d{9}$/.test(PHONE)) $('custPhone').value = '0' + PHONE.slice(2);

const qs = $('qs');
QUESTIONS.forEach(q => {
  const row = document.createElement('div'); row.className = 'q';
  row.innerHTML = `<span>${q.label}</span><div class="stars"></div>`;
  const box = row.querySelector('.stars');
  for (let i = 1; i <= 5; i++) {
    const b = document.createElement('button'); b.type = 'button'; b.textContent = '★';
    b.setAttribute('aria-label', i + ' نجوم');
    b.onclick = () => { stars[q.id] = i;
      [...box.children].forEach((s, k) => s.classList.toggle('on', k < i)); update(); };
    box.appendChild(b);
  }
  qs.appendChild(row);
});

document.querySelectorAll('#first button').forEach(b => b.onclick = () => {
  firstTime = b.dataset.v;
  document.querySelectorAll('#first button').forEach(x => x.classList.toggle('on', x === b));
});

function isBad() {
  const vals = QUESTIONS.map(q => stars[q.id]);
  const avg = vals.reduce((a, b) => a + b, 0) / vals.length;
  return avg < BAD_AVG || vals.some(v => v <= 2);
}

function update() {
  if (QUESTIONS.some(q => !stars[q.id])) return;
  const bad = isBad();
  $('goodBox').classList.toggle('hide', bad);
  $('badBox').classList.toggle('hide', !bad);
  if (bad) renderNegs();
}

function renderNegs() {
  const box = $('negs'); box.innerHTML = '';
  QUESTIONS.filter(q => stars[q.id] <= 3).forEach(q => {
    const g = document.createElement('div'); g.className = 'group';
    g.innerHTML = `<b>${q.label}</b><div class="chips"></div>`;
    const c = g.querySelector('.chips');
    NEGATIVES[q.id].forEach(t => {
      const ch = document.createElement('button'); ch.type = 'button';
      ch.className = 'chip' + (negSel.has(t) ? ' on' : ''); ch.textContent = t;
      ch.onclick = () => { negSel.has(t) ? negSel.delete(t) : negSel.add(t); ch.classList.toggle('on'); };
      c.appendChild(ch);
    });
    box.appendChild(g);
  });
}

$('sendBtn').onclick = async () => {
  const err = $('err'); err.textContent = '';
  if (QUESTIONS.some(q => !stars[q.id])) { err.textContent = 'من فضلك قيّم كل الأسئلة بالنجوم'; return; }
  if (!firstTime) { err.textContent = 'من فضلك قولنا دي أول مرة تطلب ولا لأ'; return; }
  const bad = isBad();
  let typed = $('custPhone').value.replace(/\D/g, '');
  if (typed.startsWith('20')) typed = '0' + typed.slice(2);
  if (bad && !/^01\d{9}$/.test(typed)) {
    err.textContent = 'من فضلك اكتب رقم تليفونك صح (11 رقم يبدأ بـ 01)';
    $('custPhone').focus(); return;
  }
  const shown = QUESTIONS.filter(q => stars[q.id] <= 3).flatMap(q => NEGATIVES[q.id]);
  const data = {
    phone: bad ? typed : PHONE, stars, firstTime,
    negatives: bad ? [...negSel].filter(t => shown.includes(t)) : [],
    comment: bad ? $('badComment').value : $('suggest').value
  };
  const btn = $('sendBtn'); btn.disabled = true; btn.textContent = 'جاري الإرسال...';
  try {
    await fetch(API, { method: 'POST', mode: 'no-cors',
      headers: { 'Content-Type': 'text/plain;charset=utf-8' }, body: JSON.stringify(data) });
    $('form').classList.add('hide');
    $('done').classList.remove('hide');
    $('doneMsg').textContent = bad
      ? 'آسفين إن التجربة مكانتش زي ما تستاهل، والإدارة هتراجع ملاحظاتك بنفسها.'
      : 'مبسوطين إن الأوردر عجبك، ومستنيينك المرة الجاية 🧡';
    window.scrollTo(0, 0);
  } catch (e) {
    btn.disabled = false; btn.textContent = 'إرسال التقييم';
    err.textContent = 'النت فصل، جرّب تاني';
  }
};
</script>

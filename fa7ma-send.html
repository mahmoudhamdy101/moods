<!DOCTYPE html>
<html dir="rtl" lang="ar">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>إرسال تقييم فحمة</title>
<link href="https://fonts.googleapis.com/css2?family=Cairo:wght@400;600;800&display=swap" rel="stylesheet">
<style>
  :root{--bg:#fff8e6;--card:#fff;--fg:#1d1b19;--muted:#6f6a64;--line:#f1dfb0;--fire:#cc0903;--wa:#1f9d55;--done:#a8a29b}
  *{box-sizing:border-box}
  body{margin:0;background:var(--bg);color:var(--fg);font-family:'Cairo',Tahoma,Arial,sans-serif}
  .wrap{max-width:520px;margin:0 auto;padding:16px 16px 48px}
  header{display:flex;align-items:center;gap:12px;margin-bottom:14px}
  header img{width:56px;height:auto;border-radius:12px}
  header h1{margin:0;font-size:20px}
  header p{margin:0;color:var(--muted);font-size:13px}
  .card{background:var(--card);border:1px solid var(--line);border-radius:14px;padding:14px;margin-bottom:12px}
  .lbl{display:block;font-weight:700;margin-bottom:8px}
  textarea{width:100%;border:1.5px solid var(--line);border-radius:10px;background:var(--bg);color:var(--fg);
    padding:10px;font:16px/1.6 monospace;direction:ltr;text-align:left;resize:vertical}
  .seg{display:flex;gap:8px}
  .seg button{flex:1;padding:12px;border-radius:12px;border:1.5px solid var(--line);background:var(--card);
    color:var(--fg);font:700 16px 'Cairo',Tahoma,sans-serif;cursor:pointer}
  .seg button.on{background:var(--wa);border-color:var(--wa);color:#fff}
  .go{width:100%;padding:14px;border:0;border-radius:12px;background:var(--fire);color:#fff;
    font:800 18px 'Cairo',Tahoma,sans-serif;cursor:pointer}
  .bar{display:flex;justify-content:space-between;align-items:center;margin-bottom:4px}
  .count{color:var(--muted);font-size:14px}
  .clear{background:none;border:1px solid var(--line);color:var(--muted);border-radius:8px;padding:4px 10px;font:inherit;font-size:13px}
  .row{display:flex;justify-content:space-between;align-items:center;padding:10px 0;border-top:1px solid var(--line)}
  .num{direction:ltr;font-family:monospace;font-size:17px}
  .row a{background:var(--wa);color:#fff;text-decoration:none;font-weight:800;padding:9px 18px;border-radius:10px}
  .row.sent .num{color:var(--done);text-decoration:line-through}
  .row.sent a{background:var(--done)}
  .msg{white-space:pre-wrap;line-height:1.8;background:var(--bg);border-radius:10px;padding:10px;font-size:15px}
  .hide{display:none}
</style>
</head>

    <div><h1>إرسال تقييم فحمة</h1><p>الصق الأرقام واضغط إرسال جنب كل رقم</p></div>
  </header>

  <div class="card">
    <span class="lbl">هتبعت من:</span>
    <div class="seg" id="app">
      <button type="button" data-v="biz">واتساب بيزنس</button>
      <button type="button" data-v="reg">واتساب عادي</button>
    </div>
  </div>

  <div class="card">
    <label class="lbl" for="nums">أرقام العملاء (رقم في كل سطر)</label>
    <textarea id="nums" rows="6" placeholder="01012345678&#10;01198765432"></textarea>
    <div style="height:10px"></div>
    <button type="button" class="go" id="make">جهّز الأرقام</button>
  </div>

  <div class="card hide" id="listCard">
    <div class="bar"><span class="count" id="count"></span>
      <button type="button" class="clear" id="reset">ابدأ من جديد</button></div>
    <div id="list"></div>
  </div>

  <div class="card">
    <span class="lbl">الرسالة اللي هتوصل للعميل</span>
    <div class="msg" id="preview"></div>
  </div>
</div>

<script>
// لينك صفحة التقييم = نفس الفولدر اللي فيه الصفحة دي
const RATE_URL = new URL('./fa7ma.html', location.href).href;
const MESSAGE = n =>
`أهلاً بيك 👋
شكراً إنك طلبت من فحمة النهاردة ❤️
رأيك يهمنا جداً، ممكن تقيّم الأوردر في أقل من دقيقة؟
${RATE_URL}?p=${n}`;

const $ = id => document.getElementById(id);
const today = new Date().toISOString().slice(0, 10);
const load = k => { try { return JSON.parse(localStorage.getItem(k)); } catch (e) { return null; } };
const save = (k, v) => { try { localStorage.setItem(k, JSON.stringify(v)); } catch (e) {} };

$('preview').textContent = MESSAGE('رقم-العميل').replace(/\n[^\n]*$/, '\n(لينك التقييم)');

let app = load('fa7ma-app') || 'biz';
function paintApp() {
  document.querySelectorAll('#app button').forEach(b => b.classList.toggle('on', b.dataset.v === app));
}
document.querySelectorAll('#app button').forEach(b => b.onclick = () => {
  app = b.dataset.v; save('fa7ma-app', app); paintApp(); render();
});
paintApp();

function norm(n) {
  n = n.replace(/\D/g, '');
  if (n.startsWith('00')) n = n.slice(2);
  if (n.length === 11 && n.startsWith('01')) n = '2' + n;
  if (n.length === 10 && n.startsWith('1')) n = '20' + n;
  return /^201\d{9}$/.test(n) ? n : '';
}
function extract(t) {
  return [...new Set((t.match(/\+?\d[\d\s-]{8,}\d/g) || []).map(norm).filter(Boolean))];
}

function waLink(n) {
  const enc = encodeURIComponent(MESSAGE(n));
  if (!/android/i.test(navigator.userAgent)) return `https://wa.me/${n}?text=${enc}`;
  const pkg = app === 'biz' ? 'com.whatsapp.w4b' : 'com.whatsapp';
  const fallback = encodeURIComponent(`https://wa.me/${n}?text=${enc}`);
  return `intent://send/?phone=${n}&text=${enc}#Intent;scheme=whatsapp;package=${pkg};S.browser_fallback_url=${fallback};end`;
}

let state = load('fa7ma-send');
if (!state || state.day !== today) state = { day: today, nums: [], sent: [] };

function render() {
  const list = $('list'); list.innerHTML = '';
  $('listCard').classList.toggle('hide', !state.nums.length);
  $('count').textContent = `${state.nums.length} رقم — اتبعت ${state.sent.length}`;
  state.nums.forEach(n => {
    const sent = state.sent.includes(n);
    const r = document.createElement('div'); r.className = 'row' + (sent ? ' sent' : '');
    r.innerHTML = `<span class="num">0${n.slice(2)}</span><a href="${waLink(n)}">${sent ? 'اتبعت ✓' : 'إرسال'}</a>`;
    r.querySelector('a').addEventListener('click', () => {
      if (!state.sent.includes(n)) state.sent.push(n);
      save('fa7ma-send', state); setTimeout(render, 300);
    });
    list.appendChild(r);
  });
}

$('make').onclick = () => {
  const nums = extract($('nums').value);
  if (!nums.length) { $('nums').focus(); return; }
  state.nums = [...new Set([...state.nums, ...nums])];
  $('nums').value = ''; save('fa7ma-send', state); render();
};
$('reset').onclick = () => { state = { day: today, nums: [], sent: [] }; save('fa7ma-send', state); render(); };
render();
</script>
</body>
</html>
